<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selenium Login Automation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="login-card">
        <h1>Student Login</h1>
        <p class="subtitle">Selenium WebDriver Practical</p>

        <form id="loginForm">
            <label for="username">Username</label>
            <input type="text" id="username" name="username"
                   placeholder="Enter username" autocomplete="username">

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   placeholder="Enter password" autocomplete="current-password">

            <button type="submit" id="loginBtn">Login</button>
        </form>

        <p id="message" role="status" aria-live="polite"></p>
    </main>

    <script>
        // Demonstration-only credentials. Do not use this approach for real authentication.
        const VALID_USERNAME = "student";
        const VALID_PASSWORD = "Selenium@123";

        document.getElementById("loginForm").addEventListener("submit", function (event) {
            event.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const message = document.getElementById("message");

            if (username === VALID_USERNAME && password === VALID_PASSWORD) {
                message.textContent = "Login successful!";
                message.className = "success";
            } else {
                message.textContent = "Invalid username or password!";
                message.className = "error";
            }
        });
    </script>
</body>
</html>
